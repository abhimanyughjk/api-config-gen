<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Neon Gradient -->
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"></stop>
      <stop offset="100%" stop-color="#8a2eff"></stop>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0a0a0a"></rect>

  <!-- API Brackets -->
  <path d="M18 20 L10 32 L18 44" stroke="url(#neon)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)"></path>

  <path d="M46 20 L54 32 L46 44" stroke="url(#neon)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)"></path>

  <!-- AI Core (Neural Dot + Lines) -->
  <circle cx="32" cy="32" r="4" fill="url(#neon)" filter="url(#glow)"></circle>

  <line x1="32" y1="18" x2="32" y2="28" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"></line>
  <line x1="32" y1="36" x2="32" y2="46" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"></line>
  <line x1="18" y1="32" x2="28" y2="32" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"></line>
  <line x1="36" y1="32" x2="46" y2="32" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"></line>

  <!-- Subtle Circuit Nodes -->
  <circle cx="32" cy="18" r="1.5" fill="#00f0ff"></circle>
  <circle cx="32" cy="46" r="1.5" fill="#8a2eff"></circle>
  <circle cx="18" cy="32" r="1.5" fill="#00f0ff"></circle>
  <circle cx="46" cy="32" r="1.5" fill="#8a2eff"></circle>
</svg>